name: Generate Excalidraw SVG

on:
  push:
    paths:
      - "**/*.excalidraw"
  workflow_dispatch:

jobs:
  export-svg:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Convert Excalidraw files to SVG
        run: |
          # Install temporary dependencies outside the workspace
          cd /tmp
          npm install @excalidraw/utils jsdom
          cd $GITHUB_WORKSPACE

          # Execute inline Node renderer
          NODE_PATH=/tmp/node_modules node -e '
          const fs = require("fs");
          const path = require("path");
          const { JSDOM } = require("jsdom");

          // Initialize DOM environment for Excalidraw
          const dom = new JSDOM("<!DOCTYPE html><html><body></body></html>");
          global.window = dom.window;
          global.document = dom.window.document;
          global.navigator = dom.window.navigator;

          const { exportToSvg } = require("@excalidraw/utils");

          function getFiles(dir, extension) {
            let results = [];
            const list = fs.readdirSync(dir);
            list.forEach(file => {
              file = path.join(dir, file);
              const stat = fs.statSync(file);
              if (stat && stat.isDirectory()) {
                if (!file.includes("node_modules") && !file.includes(".git")) {
                  results = results.concat(getFiles(file, extension));
                }
              } else if (file.endsWith(extension)) {
                results.push(file);
              }
            });
            return results;
          }

          (async () => {
            const files = getFiles(".", ".excalidraw");
            for (const file of files) {
              const svgPath = file.replace(/\.excalidraw$/, ".svg");
              console.log(`Processing: ${file} -> ${svgPath}`);
              
              const content = JSON.parse(fs.readFileSync(file, "utf8"));
              const svg = await exportToSvg({
                elements: content.elements,
                appState: content.appState || {},
                files: content.files || {}
              });
              
              fs.writeFileSync(svgPath, svg.outerHTML);
            }
          })();
          '

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only track actual SVG outputs corresponding to excalidraw files
          git add *.svg **/*.svg 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No SVG changes detected."
          else
            git commit -m "chore: auto-generate Excalidraw SVGs [skip ci]"
            git push
          fi
