name: Generate Excalidraw SVG

on:
  push:
    paths:
      - "**/*.excalidraw"

jobs:
  export-svg:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Excalidraw CLI
        run: npm install -g @excalidraw/excalidraw-cli

      - name: Export Excalidraw to SVG
        run: |
          excalidraw-to-svg LLD.excalidraw > LLD.svg

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add LLD.svg

          if git diff --cached --quiet; then
            echo "No SVG changes"
          else
            git commit -m "chore: update LLD SVG"
            git push
          fi