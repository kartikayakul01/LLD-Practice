name: Generate Excalidraw SVG

on:
  push:
    paths:
      - "**/*.excalidraw"
  workflow_dispatch:

jobs:
  export-svg:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install temporary dependencies
        run: |
          npm install @excalidraw/utils excalidraw-to-svg

      - name: Generate SVGs for all Excalidraw files
        run: |
          # Find all .excalidraw files recursively and convert each to .svg
          find . -type f -name "*.excalidraw" | while read -r file; do
            output_file="${file%.excalidraw}.svg"
            echo "Converting $file -> $output_file"
            npx excalidraw-to-svg "$file" "$output_file"
          done

      - name: Verify generated SVGs
        run: |
          echo "All generated SVGs in repository:"
          find . -type f -name "*.svg"

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "*.svg"

          if git diff --cached --quiet; then
            echo "No SVG changes to commit"
          else
            git commit -m "chore: update Excalidraw SVGs [skip ci]"
            git push
          fi