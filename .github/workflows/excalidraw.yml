name: Generate Excalidraw SVG

on:
  push:
    paths:
      - "**/*.excalidraw"
  workflow_dispatch:

jobs:
  export-svg:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: List Repository Files (Before)
        run: |
          echo "=== Directory Listing Before Processing ==="
          ls -la
          find . -name "*.excalidraw"

      - name: Generate SVGs via Headless Chrome
        run: |
          cd /tmp
          npm install puppeteer
          cd $GITHUB_WORKSPACE

          NODE_PATH=/tmp/node_modules node -e '
          const fs = require("fs");
          const path = require("path");
          const puppeteer = require("puppeteer");

          function findExcalidrawFiles(dir) {
            let results = [];
            const list = fs.readdirSync(dir);
            list.forEach(file => {
              const fullPath = path.join(dir, file);
              const stat = fs.statSync(fullPath);
              if (stat && stat.isDirectory()) {
                if (!file.startsWith(".") && file !== "node_modules") {
                  results = results.concat(findExcalidrawFiles(fullPath));
                }
              } else if (file.endsWith(".excalidraw")) {
                results.push(fullPath);
              }
            });
            return results;
          }

          (async () => {
            try {
              const files = findExcalidrawFiles(".");
              console.log(`Found ${files.length} .excalidraw file(s):`, files);

              if (files.length === 0) {
                console.log("No .excalidraw files found to process.");
                return;
              }

              const browser = await puppeteer.launch({
                headless: true,
                args: ["--no-sandbox", "--disable-setuid-sandbox"]
              });
              const page = await browser.newPage();

              // Listen to browser console logs for errors
              page.on("console", msg => console.log("PAGE LOG:", msg.text()));
              page.on("pageerror", err => console.log("PAGE ERROR:", err.toString()));

              await page.setContent(`
                <!DOCTYPE html>
                <html>
                  <head>
                    <script type="module">
                      import * as ExcalidrawUtils from "https://esm.sh/@excalidraw/utils";
                      window.ExcalidrawUtils = ExcalidrawUtils;
                    </script>
                  </head>
                  <body></body>
                </html>
              `);

              await page.waitForFunction(() => window.ExcalidrawUtils && window.ExcalidrawUtils.exportToSvg, { timeout: 30000 });

              for (const file of files) {
                const svgPath = file.replace(/\.excalidraw$/, ".svg");
                console.log(`Converting: ${file} -> ${svgPath}`);

                const jsonContent = JSON.parse(fs.readFileSync(file, "utf8"));

                const svgString = await page.evaluate(async (data) => {
                  const svgElement = await window.ExcalidrawUtils.exportToSvg({
                    elements: data.elements,
                    appState: {
                      ...data.appState,
                      exportWithBackground: true
                    },
                    files: data.files || {}
                  });
                  return svgElement.outerHTML;
                }, jsonContent);

                fs.writeFileSync(svgPath, svgString);
                console.log(`Successfully wrote ${svgPath} (${fs.statSync(svgPath).size} bytes)`);
              }

              await browser.close();
            } catch (err) {
              console.error("Script Error:", err);
              process.exit(1);
            }
          })();
          '

      - name: List Repository Files (After)
        run: |
          echo "=== Directory Listing After Processing ==="
          ls -la
          echo "=== SVG Files Found ==="
          find . -name "*.svg"

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage all generated SVG files explicitly
          git add -A "*.svg"

          echo "=== Git Status ==="
          git status

          if git diff --cached --quiet; then
            echo "No SVG changes to commit."
          else
            git commit -m "chore: export full length Excalidraw SVGs [skip ci]"
            git push
          fi
