name: Generate Excalidraw SVG

on:
  push:
    paths:
      - "**/*.excalidraw"
  workflow_dispatch:

jobs:
  export-svg:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SVG
        run: |
          npx --yes excalidraw-to-svg LLD.excalidraw LLD.svg

      - name: Verify SVG
        run: |
          test -f LLD.svg
          echo "SVG generated successfully:"
          ls -lh LLD.svg

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add LLD.svg

          if git diff --cached --quiet; then
            echo "No changes in SVG"
          else
            git commit -m "chore: update LLD SVG [skip ci]"
            git push
          fi