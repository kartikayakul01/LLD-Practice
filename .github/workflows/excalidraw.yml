name: Generate Excalidraw SVG

on:
  push:
    paths:
      - "**/*.excalidraw"
  workflow_dispatch:

jobs:
  export-svg:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Excalidraw exporter
        run: npm install -g excalidraw_export

      - name: Generate SVG
        run: |
          excalidraw_export LLD.excalidraw

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add LLD.excalidraw.svg

          if git diff --cached --quiet; then
            echo "No SVG changes"
          else
            git commit -m "chore: update LLD SVG"
            git push
          fi