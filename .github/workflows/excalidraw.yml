name: Generate Excalidraw SVG

on:
  push:
    paths:
      - "**/*.excalidraw"
  workflow_dispatch:

jobs:
  export-svg:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate SVG
        run: |
          npm install jsdom @excalidraw/utils
          node -e '
          const fs = require("fs");
          const { JSDOM } = require("jsdom");

          // Setup headless DOM window context for Excalidraw exporter
          const dom = new JSDOM("<!DOCTYPE html><html><body></body></html>");
          global.window = dom.window;
          global.document = dom.window.document;
          global.navigator = dom.window.navigator;

          const { exportToSvg } = require("@excalidraw/utils");

          (async () => {
            const fileContent = fs.readFileSync("LLD.excalidraw", "utf8");
            const data = JSON.parse(fileContent);
            
            const svgElement = await exportToSvg({
              elements: data.elements,
              appState: data.appState || {},
              files: data.files || {}
            });

            fs.writeFileSync("LLD.svg", svgElement.outerHTML);
            console.log("Successfully generated LLD.svg");
          })();
          '

      - name: Verify SVG
        run: |
          test -f LLD.svg
          echo "SVG generated successfully:"
          ls -lh LLD.svg

      - name: Commit generated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add LLD.svg

          if git diff --cached --quiet; then
            echo "No changes in SVG"
          else
            git commit -m "chore: update LLD SVG [skip ci]"
            git push
          fi
