name: Generate Excalidraw SVG

on:
  push:
    paths:
      - "**"
  workflow_dispatch:

jobs:
  export-svg:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate SVGs via Headless Chrome
        run: |
          # Install puppeteer outside your project directory so no package.json/node_modules are created in your repo
          cd /tmp
          npm install puppeteer
          cd $GITHUB_WORKSPACE

          NODE_PATH=/tmp/node_modules node -e '
          const fs = require("fs");
          const path = require("path");
          const puppeteer = require("puppeteer");

          function findExcalidrawFiles(dir) {
            let results = [];
            const list = fs.readdirSync(dir);
            list.forEach(file => {
              const fullPath = path.join(dir, file);
              const stat = fs.statSync(fullPath);
              if (stat && stat.isDirectory()) {
                if (!file.startsWith(".") && file !== "node_modules") {
                  results = results.concat(findExcalidrawFiles(fullPath));
                }
              } else if (file.endsWith(".excalidraw")) {
                results.push(fullPath);
              }
            });
            return results;
          }

          (async () => {
            const browser = await puppeteer.launch({
              headless: true,
              args: ["--no-sandbox", "--disable-setuid-sandbox"]
            });
            const page = await browser.newPage();

            // Load official Excalidraw utils bundled in the browser page context
            await page.setContent(`
              <!DOCTYPE html>
              <html>
                <head>
                  <script type="module">
                    import * as ExcalidrawUtils from "https://esm.sh/@excalidraw/utils";
                    window.ExcalidrawUtils = ExcalidrawUtils;
                  </script>
                </head>
                <body></body>
              </html>
            `);

            // Wait for Excalidraw bundle to load in browser window context
            await page.waitForFunction(() => window.ExcalidrawUtils && window.ExcalidrawUtils.exportToSvg);

            const files = findExcalidrawFiles(".");
            console.log(`Found ${files.length} .excalidraw file(s).`);

            for (const file of files) {
              const svgPath = file.replace(/\.excalidraw$/, ".svg");
              console.log(`Exporting full SVG: ${file} -> ${svgPath}`);

              const jsonContent = JSON.parse(fs.readFileSync(file, "utf8"));

              // Execute full export inside real browser window context
              const svgString = await page.evaluate(async (data) => {
                const svgElement = await window.ExcalidrawUtils.exportToSvg({
                  elements: data.elements,
                  appState: {
                    ...data.appState,
                    exportWithBackground: true
                  },
                  files: data.files || {}
                });
                return svgElement.outerHTML;
              }, jsonContent);

              fs.writeFileSync(svgPath, svgString);
            }

            await browser.close();
            console.log("All SVGs rendered successfully.");
          })();
          '

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only stage the .svg outputs
          git add "*.svg" "**/*.svg" 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes in SVGs"
          else
            git commit -m "chore: export full length Excalidraw SVGs [skip ci]"
            git push
          fi
